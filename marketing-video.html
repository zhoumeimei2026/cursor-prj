<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内窥镜主控板 & 影像系统定制 | 营销视频</title>
  <style>
    /* ─── Reset & base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1920px; height: 1080px;
      overflow: hidden;
      font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      background: #000;
    }

    /* ─── Scene container ─────────────────────────────────────── */
    .stage {
      position: relative;
      width: 1920px; height: 1080px;
      background: radial-gradient(ellipse at 30% 50%, #0a1f3d 0%, #020b18 60%, #000 100%);
      overflow: hidden;
    }

    /* ─── Animated circuit-grid background ───────────────────── */
    .grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(0,180,255,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,180,255,.07) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridPulse 5s linear forwards;
    }
    @keyframes gridPulse {
      0%   { opacity: 0; }
      10%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ─── Particle dots ───────────────────────────────────────── */
    .particles {
      position: absolute; inset: 0;
      pointer-events: none;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(0, 200, 255, 0.7);
      animation: float linear infinite;
    }

    /* ─── Glowing ring (representing a camera lens / scope) ───── */
    .lens-ring {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 520px; height: 520px;
      border-radius: 50%;
      border: 3px solid rgba(0,200,255,0.5);
      box-shadow:
        0 0 40px rgba(0,200,255,0.4),
        inset 0 0 60px rgba(0,200,255,0.15);
      animation: lensAppear 5s ease forwards;
    }
    .lens-ring::before {
      content: '';
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 1px solid rgba(0,200,255,0.25);
    }
    .lens-ring::after {
      content: '';
      position: absolute;
      inset: 36px;
      border-radius: 50%;
      border: 1px dashed rgba(0,200,255,0.18);
      animation: spinRing 4s linear infinite;
    }
    @keyframes lensAppear {
      0%   { transform: translate(-50%,-50%) scale(0);   opacity: 0; }
      18%  { transform: translate(-50%,-50%) scale(1.08); opacity: 1; }
      28%  { transform: translate(-50%,-50%) scale(1);   opacity: 1; }
      78%  { transform: translate(-50%,-50%) scale(1);   opacity: 1; }
      100% { transform: translate(-50%,-50%) scale(1.4); opacity: 0; }
    }
    @keyframes spinRing {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ─── Scan line sweep ─────────────────────────────────────── */
    .scan {
      position: absolute;
      left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent 0%, rgba(0,220,255,.8) 50%, transparent 100%);
      top: -3px;
      animation: scanLine 5s linear forwards;
    }
    @keyframes scanLine {
      0%   { top: -3px;   opacity: 0; }
      8%   { top: -3px;   opacity: 1; }
      90%  { top: 1083px; opacity: 1; }
      100% { top: 1083px; opacity: 0; }
    }

    /* ─── Left-side circuit decoration ───────────────────────── */
    .circuit-left {
      position: absolute;
      left: 60px; top: 50%;
      transform: translateY(-50%);
      width: 180px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: sideIn 5s ease forwards;
    }
    @keyframes sideIn {
      0%   { opacity: 0; transform: translateY(-50%) translateX(-40px); }
      20%  { opacity: 1; transform: translateY(-50%) translateX(0); }
      80%  { opacity: 1; }
      100% { opacity: 0; }
    }
    .chip-label {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgba(0,200,255,0.7);
      text-transform: uppercase;
      border-left: 2px solid rgba(0,200,255,0.5);
      padding-left: 10px;
    }
    .chip-bar {
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(90deg, rgba(0,200,255,0.9), rgba(0,80,180,0.2));
      animation: barGrow 1s ease forwards;
    }

    /* ─── Right-side specs ────────────────────────────────────── */
    .specs-right {
      position: absolute;
      right: 60px; top: 50%;
      transform: translateY(-50%);
      text-align: right;
      animation: sideInR 5s ease forwards;
    }
    @keyframes sideInR {
      0%   { opacity: 0; transform: translateY(-50%) translateX(40px); }
      20%  { opacity: 1; transform: translateY(-50%) translateX(0); }
      80%  { opacity: 1; }
      100% { opacity: 0; }
    }
    .spec-item {
      margin-bottom: 18px;
    }
    .spec-value {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
    }
    .spec-value span {
      font-size: 14px;
      font-weight: 400;
      color: rgba(0,200,255,0.9);
      margin-left: 4px;
    }
    .spec-desc {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 1px;
      margin-top: 2px;
    }

    /* ─── Center text block ───────────────────────────────────── */
    .center-text {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 700px;
      z-index: 10;
    }

    /* Scene 1 – Tag line */
    .tag-line {
      font-size: 20px;
      letter-spacing: 8px;
      color: rgba(0,200,255,0.85);
      text-transform: uppercase;
      white-space: nowrap;
      animation: fadeSlideUp 5s ease forwards;
      animation-delay: 0.2s;
      opacity: 0;
    }

    /* Scene 2 – Main headline */
    .headline {
      font-size: 62px;
      font-weight: 900;
      color: #fff;
      line-height: 1.15;
      letter-spacing: 4px;
      text-shadow: 0 0 60px rgba(0,180,255,0.5);
      animation: headlineAnim 5s ease forwards;
      animation-delay: 0.5s;
      opacity: 0;
      margin-top: 18px;
    }
    .headline em {
      font-style: normal;
      color: #00d4ff;
    }

    /* Scene 3 – Sub headline */
    .sub-headline {
      font-size: 22px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 3px;
      margin-top: 20px;
      animation: fadeSlideUp 5s ease forwards;
      animation-delay: 1.0s;
      opacity: 0;
    }

    /* Scene 4 – CTA badge */
    .cta-badge {
      display: inline-block;
      margin-top: 36px;
      padding: 14px 44px;
      border: 2px solid rgba(0,200,255,0.9);
      border-radius: 40px;
      font-size: 17px;
      letter-spacing: 4px;
      color: #fff;
      background: rgba(0,180,255,0.12);
      box-shadow: 0 0 30px rgba(0,200,255,0.3);
      animation: ctaAnim 5s ease forwards;
      animation-delay: 1.5s;
      opacity: 0;
    }

    /* ─── Shared keyframes ────────────────────────────────────── */
    @keyframes fadeSlideUp {
      0%   { opacity: 0; transform: translateY(20px); }
      18%  { opacity: 1; transform: translateY(0); }
      75%  { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-10px); }
    }
    @keyframes headlineAnim {
      0%   { opacity: 0; transform: scale(0.92) translateY(10px); }
      18%  { opacity: 1; transform: scale(1) translateY(0); }
      75%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.04); }
    }
    @keyframes ctaAnim {
      0%   { opacity: 0; transform: scale(0.9); }
      18%  { opacity: 1; transform: scale(1.05); }
      28%  { opacity: 1; transform: scale(1); }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ─── Bottom bar ──────────────────────────────────────────── */
    .bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 56px;
      background: linear-gradient(90deg,
        rgba(0,180,255,0.25) 0%,
        rgba(0,80,180,0.15) 50%,
        rgba(0,180,255,0.25) 100%);
      border-top: 1px solid rgba(0,200,255,0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 60px;
      animation: barFade 5s ease forwards;
    }
    @keyframes barFade {
      0%   { opacity: 0; }
      15%  { opacity: 1; }
      80%  { opacity: 1; }
      100% { opacity: 0; }
    }
    .bar-logo {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 4px;
      color: rgba(0,200,255,0.9);
      text-transform: uppercase;
    }
    .bar-slogan {
      font-size: 13px;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.4);
    }

    /* ─── Top accent line ─────────────────────────────────────── */
    .top-accent {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(0,200,255,0.9) 30%,
        rgba(0,130,255,1) 50%,
        rgba(0,200,255,0.9) 70%,
        transparent 100%);
      animation: barFade 5s ease forwards;
    }

    /* ─── Corner decorations ──────────────────────────────────── */
    .corner {
      position: absolute;
      width: 40px; height: 40px;
      animation: barFade 5s ease forwards;
    }
    .corner-tl { top: 16px; left: 20px; border-top: 2px solid rgba(0,200,255,0.7); border-left: 2px solid rgba(0,200,255,0.7); }
    .corner-tr { top: 16px; right: 20px; border-top: 2px solid rgba(0,200,255,0.7); border-right: 2px solid rgba(0,200,255,0.7); }
    .corner-bl { bottom: 70px; left: 20px; border-bottom: 2px solid rgba(0,200,255,0.7); border-left: 2px solid rgba(0,200,255,0.7); }
    .corner-br { bottom: 70px; right: 20px; border-bottom: 2px solid rgba(0,200,255,0.7); border-right: 2px solid rgba(0,200,255,0.7); }

    /* ─── Glow orb behind lens ────────────────────────────────── */
    .orb {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 340px; height: 340px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,120,255,0.22) 0%, transparent 70%);
      animation: orbPulse 5s ease forwards;
    }
    @keyframes orbPulse {
      0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }
      20%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
      70%  { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      100% { opacity: 0; }
    }

    /* ─── Floating data labels ────────────────────────────────── */
    .data-label {
      position: absolute;
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(0,200,255,0.65);
      border: 1px solid rgba(0,200,255,0.3);
      padding: 4px 10px;
      border-radius: 3px;
      background: rgba(0,10,30,0.6);
      white-space: nowrap;
      animation: labelFade 5s ease forwards;
    }
    @keyframes labelFade {
      0%   { opacity: 0; }
      25%  { opacity: 1; }
      80%  { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes float {
      0%   { transform: translateY(0)   scale(1);   opacity: .8; }
      50%  { transform: translateY(-30px) scale(1.2); opacity: .4; }
      100% { transform: translateY(0)   scale(1);   opacity: .8; }
    }

    /* ─── Progress bar ────────────────────────────────────────── */
    .progress-track {
      position: absolute;
      bottom: 56px; left: 0; right: 0;
      height: 2px;
      background: rgba(0,200,255,0.1);
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d4ff, #0050ff);
      width: 0;
      animation: progress 5s linear forwards;
    }
    @keyframes progress {
      0%   { width: 0; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
<div class="stage">

  <!-- Background grid -->
  <div class="grid"></div>

  <!-- Scan line -->
  <div class="scan"></div>

  <!-- Top & bottom accents -->
  <div class="top-accent"></div>
  <div class="bottom-bar">
    <span class="bar-logo">Endo Vision Tech</span>
    <span class="bar-slogan">内窥镜主控板 &amp; 影像系统定制专家</span>
    <span class="bar-logo" style="font-size:13px; font-weight:400;">contact@endovision.cn</span>
  </div>
  <div class="progress-track"><div class="progress-fill"></div></div>

  <!-- Corner brackets -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- Glow orb -->
  <div class="orb"></div>

  <!-- Lens ring -->
  <div class="lens-ring"></div>

  <!-- Floating data labels -->
  <div class="data-label" style="top:180px; left:680px; animation-delay:.6s;">4K · 60fps · HDR</div>
  <div class="data-label" style="top:220px; right:680px; animation-delay:.8s;">FPGA · DSP · ISP</div>
  <div class="data-label" style="bottom:200px; left:680px; animation-delay:1.0s;">USB3.0 · HDMI · SDI</div>
  <div class="data-label" style="bottom:200px; right:680px; animation-delay:1.2s;">EMC · CE · ISO 认证</div>

  <!-- Left circuit panel -->
  <div class="circuit-left">
    <span class="chip-label">主控模块</span>
    <div class="chip-bar" style="width:140px;"></div>
    <span class="chip-label">图像处理</span>
    <div class="chip-bar" style="width:110px;"></div>
    <span class="chip-label">光源驱动</span>
    <div class="chip-bar" style="width:130px;"></div>
    <span class="chip-label">数据传输</span>
    <div class="chip-bar" style="width:95px;"></div>
    <span class="chip-label">电源管理</span>
    <div class="chip-bar" style="width:120px;"></div>
  </div>

  <!-- Right specs panel -->
  <div class="specs-right">
    <div class="spec-item">
      <div class="spec-value">4K<span>超高清</span></div>
      <div class="spec-desc">CMOS · 实时降噪</div>
    </div>
    <div class="spec-item">
      <div class="spec-value">&lt; 16ms<span>延迟</span></div>
      <div class="spec-desc">端到端图像流水线</div>
    </div>
    <div class="spec-item">
      <div class="spec-value">OEM<span>定制</span></div>
      <div class="spec-desc">软硬件全栈交付</div>
    </div>
  </div>

  <!-- Center text -->
  <div class="center-text">
    <div class="tag-line">专注医疗影像核心技术</div>
    <div class="headline">内窥镜<em>主控板</em><br/>影像系统定制</div>
    <div class="sub-headline">从传感器到显示端 · 一站式解决方案</div>
    <div class="cta-badge">立即咨询定制方案</div>
  </div>

  <!-- Particle field (generated by JS) -->
  <div class="particles" id="particles"></div>

</div>

<script>
  /* Generate floating particles */
  const container = document.getElementById('particles');
  for (let i = 0; i < 55; i++) {
    const p = document.createElement('div');
    p.classList.add('particle');
    const size = Math.random() * 3 + 1;
    p.style.cssText = `
      width: ${size}px;
      height: ${size}px;
      left: ${Math.random() * 100}%;
      top: ${Math.random() * 100}%;
      opacity: ${Math.random() * 0.6 + 0.1};
      animation-duration: ${Math.random() * 4 + 3}s;
      animation-delay: ${Math.random() * 3}s;
    `;
    container.appendChild(p);
  }
</script>
</body>
</html>
